[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/booked.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The ledger must never run from a stale copy on a phone.
[[headers]]
  for = "/ledger.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The booking page must never run from a stale copy — an old cached version can
# still carry fields that cause a submission to be discarded.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
